services:
  - type: web
    name: openclaw
    runtime: image
    plan: standard
    image:
      url: ghcr.io/openclaw/openclaw:latest
    dockerCommand: sh -c "mkdir -p /data/.openclaw && node -e 'const f=\"/data/.openclaw/openclaw.json\";const fs=require(\"fs\");let c={};try{c=JSON.parse(fs.readFileSync(f,\"utf8\"))}catch(e){};c.plugins=c.plugins||{};c.plugins.allow=[\"anthropic\",\"openai\",\"memory-core\",\"telegram\"];fs.writeFileSync(f,JSON.stringify(c,null,2));' && openclaw gateway --bind lan --port 10000 --allow-unconfigured"
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "10000"
      - key: OPENCLAW_GATEWAY_BIND
        value: "lan"
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 10
